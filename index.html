<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Begarlist 16 - Galeri Foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PAGE LOADER -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-ring"></div>
    <span class="loader-text">Memuat Galeri…</span>
  </div>

  <!-- NAVBAR ROW 1: home · search · dark mode -->
  <header class="header">
    <div class="header-inner header-row1">
      <a href="https://begarlist16.github.io" class="home-btn" title="Kembali ke Homepage">
        <span class="home-emoji">🏠</span>
      </a>

      <!-- Search bar -->
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Cari foto…"
          autocomplete="off"
          oninput="handleSearch(this.value)"
        />
        <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Hapus pencarian">✕</button>
      </div>

      <!-- Dark mode toggle -->
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="themeIcon">☀</span>
      </button>
    </div>

    <!-- NAVBAR ROW 2: horizontal scrollable category strip -->
    <div class="category-row" id="categoryRow">
      <button class="cat-nav-btn cat-nav-left" id="catNavLeft" onclick="scrollCatNav(-1)" aria-label="Scroll kiri">‹</button>
      <div class="category-inner" id="categoryInner">
        <button class="cat-btn" data-cat="10IPS3-Moment"    onclick="filterCategory('10IPS3-Moment',    this)">10IPS3-Moment</button>
        <button class="cat-btn" data-cat="10IPS3-Pantai"    onclick="filterCategory('10IPS3-Pantai',    this)">10IPS3-Pantai</button>
        <button class="cat-btn" data-cat="10IPS3-Bali"      onclick="filterCategory('10IPS3-Bali',      this)">10IPS3-Bali</button>
        <button class="cat-btn" data-cat="IPS-Wasana Warsa" onclick="filterCategory('IPS-Wasana Warsa', this)">IPS-Wasana Warsa</button>
        <button class="cat-btn" data-cat="Perpisahan"       onclick="filterCategory('Perpisahan',       this)">Perpisahan</button>
        <button class="cat-btn" data-cat="IPS-17an"         onclick="filterCategory('IPS-17an',         this)">IPS-17an</button>
        <button class="cat-btn" data-cat="11IPS3-Moment"    onclick="filterCategory('11IPS3-Moment',    this)">11IPS3-Moment</button>
        <button class="cat-btn" data-cat="11IPS1-Liga"      onclick="filterCategory('11IPS1-Liga',      this)">11IPS1-Liga</button>
        <button class="cat-btn" data-cat="Banana1"          onclick="filterCategory('Banana1',          this)">Banana1</button>
        <button class="cat-btn" data-cat="Banana2"          onclick="filterCategory('Banana2',          this)">Banana2</button>
        <button class="cat-btn" data-cat="12IPS-Moment"     onclick="filterCategory('12IPS-Moment',     this)">12IPS-Moment</button>
        <button class="cat-btn" data-cat="Organisasi"       onclick="filterCategory('Organisasi',       this)">Organisasi</button>
        <button class="cat-btn" data-cat="Ultah-BHS36"      onclick="filterCategory('Ultah-BHS36',      this)">Ultah-BHS36</button>
        <button class="cat-btn" data-cat="12IPS-FinalLiga"  onclick="filterCategory('12IPS-FinalLiga',  this)">12IPS-FinalLiga</button>
        <button class="cat-btn" data-cat="12IPS1-Moment"    onclick="filterCategory('12IPS1-Moment',    this)">12IPS1-Moment</button>
        <button class="cat-btn" data-cat="12IPS-Liga"       onclick="filterCategory('12IPS-Liga',       this)">12IPS-Liga</button>
      </div>
      <button class="cat-nav-btn cat-nav-right" id="catNavRight" onclick="scrollCatNav(1)" aria-label="Scroll kanan">›</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">

    <!-- Carousel: shown when no category is selected -->
    <div class="carousel-section" id="carouselSection">
      <div class="carousel-wrap" id="carouselWrap">
        <div class="carousel-track" id="carouselTrack"></div>
        <div class="carousel-feather carousel-feather-left"></div>
        <div class="carousel-feather carousel-feather-right"></div>
      </div>
      <p class="carousel-hint">Pilih Kategori Untuk Melihat Daftar Foto</p>
    </div>

    <div class="section-header" id="sectionHeader" style="display:none">
      <h2 class="section-title" id="sectionTitle"></h2>
      <span class="section-count" id="sectionCount"></span>
    </div>

    <!-- Photo Grid -->
    <div class="photo-grid" id="photoGrid"></div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">◎</div>
      <p class="empty-title">Tidak ada foto ditemukan</p>
      <p class="empty-sub">Coba kata kunci lain atau pilih kategori berbeda.</p>
    </div>

  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightboxOnBg(event)">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Tutup">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" onclick="lightboxNav(-1)" aria-label="Sebelumnya">‹</button>
    <button class="lb-nav lb-next" id="lbNext" onclick="lightboxNav(1)"  aria-label="Berikutnya">›</button>

    <div class="lb-body">
      <div class="lb-content">
        <div class="lb-img-loader" id="lbImgLoader"></div>
        <img id="lbImg" src="" alt="" />
      </div>
      <div class="lb-caption" id="lbCaption"></div>
      <div class="lb-strip-wrap">
        <div class="lb-strip" id="lbStrip"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 Begarlist 16 · Dibuat dengan ♥ · Galeri Foto Kelas</p>
  </footer>

  <script src="app.js"></script>
  <script src="/pwa-register.js"></script>
</body>
</html>
